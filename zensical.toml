    { "Dictionaries" = "reference/dictionaries.md" },
    { "GKG fields" = [
      { "Overview" = "reference/fields/README.md" },
      { "01 · Record ID" = "reference/fields/record-id.md" },
      { "02 · Date" = "reference/fields/date.md" },
      { "03 · Source collection" = "reference/fields/source-collection.md" },
      { "04 · Source name" = "reference/fields/source-name.md" },
      { "05 · Document identifier" = "reference/fields/document-identifier.md" },
      { "06 · Counts" = "reference/fields/counts.md" },
      { "07 · Enhanced counts" = "reference/fields/enhanced-counts.md" },
      { "08 · Themes" = "reference/fields/themes.md" },
      { "09 · Enhanced themes" = "reference/fields/enhanced-themes.md" },
      { "10 · Locations" = "reference/fields/locations.md" },
      { "11 · Enhanced locations" = "reference/fields/enhanced-locations.md" },
      { "12 · Persons" = "reference/fields/persons.md" },
      { "13 · Enhanced persons" = "reference/fields/enhanced-persons.md" },
      { "14 · Organizations" = "reference/fields/organizations.md" },
      { "15 · Enhanced organizations" = "reference/fields/enhanced-organizations.md" },
      { "16 · Tone" = "reference/fields/tone.md" },
      { "17 · Enhanced dates" = "reference/fields/enhanced-dates.md" },
      { "18 · GCAM" = "reference/fields/gcam.md" },
      { "19 · Sharing image" = "reference/fields/sharing-image.md" },
      { "20 · Related images" = "reference/fields/related-images.md" },
      { "21 · Social image embeds" = "reference/fields/social-image-embeds.md" },
      { "22 · Social video embeds" = "reference/fields/social-video-embeds.md" },
      { "23 · Quotations" = "reference/fields/quotations.md" },
      { "24 · All names" = "reference/fields/all-names.md" },
      { "25 · Amounts" = "reference/fields/amounts.md" },
      { "26 · Translation info" = "reference/fields/translation-info.md" },
      { "27 · Extra XML" = "reference/fields/extras-xml.md" },
    ] },
  ] },
  { "Evaluation" = [
    { "Results" = "evaluation/results.md" },
    { "Methodology" = "evaluation/methodology.md" },
