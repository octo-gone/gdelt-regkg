# CI uses --strict so broken pages and section links fail the build.
[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/octo-gone/gdelt-regkg"
name = "Source code on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/gdelt-regkg/"
name = "Package on PyPI"

# Zensical implements these plugins natively; do not install MkDocs equivalents.
# Only mkdocstrings' Python handler needs an additional docs dependency.
# Supported options: https://zensical.org/docs/compatibility/mkdocs/plugins/
[project.plugins.search]
enabled = true

# Preserve GitHub-style NOTE/TIP/WARNING alerts in the existing Markdown.
[project.plugins.gh-admonitions]
enabled = true

# Smaller deployed pages without changing authored Markdown or code examples.
[project.plugins.minify]
minify_html = true

# Resolve links to Python objects across the generated API reference.
[project.plugins.autorefs]
enabled = true

# Discover API pages directly from source; no generated Markdown is committed.
# Keep the API focused on record generation, resource selection and fields.
[project.plugins.api-autonav]
modules = ["src/gdelt_regkg"]
api_root_uri = "reference/api"
nav_section_title = "Python API"
exclude_private = true
show_full_namespace = false
exclude = [
  "re:^gdelt_regkg\\.(benchmark|builders|cli|scripts)(\\.|$)",
  "gdelt_regkg.fields.rule_inputs",
  "gdelt_regkg.fields.gcam_tokens",
]

[project.plugins.mkdocstrings]
default_handler = "python"
enable_inventory = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
# Static inspection avoids importing optional NLP backends or downloading models.
allow_inspection = false
docstring_style = "google"
docstring_section_style = "table"
members_order = "source"
show_source = true
show_root_heading = true
show_root_full_path = false
show_object_full_path = false
show_signature_annotations = true
separate_signature = true
merge_init_into_class = true
show_submodules = false
inherited_members = false
signature_crossrefs = false
filters = ["!^_", "^__enter__$", "^__exit__$"]

# Explicit Markdown support for reference tables, callouts, code and content tabs.
# Tables and fenced code are also built into Zensical's Markdown processing.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

