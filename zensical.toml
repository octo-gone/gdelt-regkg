# Zensical configuration reference: https://zensical.org/docs/setup/basics/
[project]
site_name = "gdelt-regkg"
site_description = "Reconstruct GDELT GKG records from article text and metadata: setup, guides, field formats and Python API."
site_author = "Nikita Klimin"

site_url = "https://octo-gone.github.io/gdelt-regkg/"
repo_url = "https://github.com/octo-gone/gdelt-regkg"
repo_name = "octo-gone/gdelt-regkg"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; Nikita Klimin — MIT license"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
dev_addr = "127.0.0.1:8000"
watch = ["src/gdelt_regkg"]

extra_javascript = [
  "javascripts/code-blocks.js",
  # Math support: https://zensical.org/docs/authoring/math/
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-chtml.js",
]

extra_css = ["stylesheets/code-blocks.css", "stylesheets/callouts.css"]

nav = [
  { "Home" = "README.md" },
  { "Get started" = [
    { "Installation and setup" = "get-started/installation-and-setup.md" },
    { "Quickstart" = "get-started/quickstart.md" },
    { "Concepts and glossary" = "get-started/concepts-and-glossary.md" },
    { "Migration" = "get-started/migration.md" },
  ] },
  { "Guides" = [
    { "Generate records" = "guides/records.md" },
    { "Build resources" = "guides/resources.md" },
    { "Build GCAM resources" = "guides/gcam-resources.md" },
    { "Build gazetteers" = "guides/gazetteers.md" },
    { "Dictionary imports" = "guides/dictionary-imports.md" },
    { "Translation" = "guides/translation.md" },
    { "GPU setup" = "guides/gpu-setup.md" },
    { "Performance" = "guides/performance.md" },
    { "Troubleshooting" = "guides/troubleshooting.md" },
    { "Benchmarking" = "guides/benchmarking.md" },
    { "Tone refinement" = "guides/tone-refinement.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Dictionaries" = "reference/dictionaries.md" },
    { "GKG fields" = [
      { "GKG field reference" = "reference/fields/README.md" },
      { "01 · Record ID" = "reference/fields/record-id.md" },
      { "02 · Batch date" = "reference/fields/date.md" },
      { "03 · Source collection" = "reference/fields/source-collection.md" },
      { "04 · Source name" = "reference/fields/source-name.md" },
      { "05 · Document identifier" = "reference/fields/document-identifier.md" },
      { "06 · Counts" = "reference/fields/counts.md" },
      { "07 · Enhanced counts" = "reference/fields/enhanced-counts.md" },
      { "08 · Themes" = "reference/fields/themes.md" },
      { "09 · Enhanced themes" = "reference/fields/enhanced-themes.md" },
      { "10 · Locations" = "reference/fields/locations.md" },
      { "11 · Enhanced locations" = "reference/fields/enhanced-locations.md" },
      { "12 · Persons" = "reference/fields/persons.md" },
      { "13 · Enhanced persons" = "reference/fields/enhanced-persons.md" },
      { "14 · Organizations" = "reference/fields/organizations.md" },
      { "15 · Enhanced organizations" = "reference/fields/enhanced-organizations.md" },
      { "16 · Tone" = "reference/fields/tone.md" },
      { "17 · Date mentions" = "reference/fields/enhanced-dates.md" },
      { "18 · GCAM" = "reference/fields/gcam.md" },
      { "19 · Sharing image" = "reference/fields/sharing-image.md" },
      { "20 · Related images" = "reference/fields/related-images.md" },
      { "21 · Social image embeds" = "reference/fields/social-image-embeds.md" },
      { "22 · Social video embeds" = "reference/fields/social-video-embeds.md" },
      { "23 · Quotations" = "reference/fields/quotations.md" },
