# Zensical configuration reference: https://zensical.org/docs/setup/basics/
[project]
site_name = "gdelt-regkg"
site_description = "Reconstruct GDELT GKG records from article text and metadata: setup, guides, field formats and Python API."
site_author = "Nikita Klimin"

site_url = "https://octo-gone.github.io/gdelt-regkg/"
repo_url = "https://github.com/octo-gone/gdelt-regkg"
repo_name = "octo-gone/gdelt-regkg"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; Nikita Klimin — MIT license"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
dev_addr = "127.0.0.1:8000"
watch = ["src/gdelt_regkg"]

# README.md serves as the homepage, preserving existing GitHub Markdown links.
# All authored pages are listed explicitly; api-autonav adds the Python API.
