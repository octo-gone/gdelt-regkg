repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run --no-sync python -X utf8 -m isort
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
      - id: ruff-check
        types_or: [python, pyi]
        args: ["--fix", "--exit-non-zero-on-fix"]

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run --no-sync python -X utf8 -m pylint
        language: system
        types: [python]
        files: ^(src/|\.github/scripts/)
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --no-sync python -X utf8 -m mypy
        language: system
        types_or: [python, pyi]
        files: ^(src/|\.github/scripts/)
        require_serial: true

  - repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff
        name: validate cff file
        description: "Validate CITATION.cff file"
        args: ["--validate"]
        files: CITATION.cff

  - repo: local
    hooks:
      - id: check-docs
        name: check documentation
        entry: uv run --no-sync python -X utf8 .github/scripts/check_docs.py
        language: system
        pass_filenames: false
        always_run: true

exclude: ^(tmp|research|output[^/]*|dist|build)/
