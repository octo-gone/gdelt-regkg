[project]
name = "gdelt-regkg"
version = "2.2.0"
description = "GDELT GKG reconstruction from article text and metadata"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Nikita Klimin" }]
keywords = ["gdelt", "gkg", "nlp", "news", "text-extraction"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[dependency-groups]
docs = [
    "zensical==0.0.71",
    "mkdocstrings-python==2.0.9",
]
dev = [
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "jsonschema>=4.18",
    "pre-commit>=4.3",
    "ruff>=0.14.1",
    "hatchling>=1.27",
    "pylint>=4.0.2",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "twine>=6.1",
]

[project.optional-dependencies]
build = [
    "pypdf>=6.20.1,<7", "pypdfium2>=5.14,<6", "Pillow>=12.3,<13", "pytesseract>=0.3.13,<0.4",
    "jieba>=0.42.1,<0.43",
]
ner = ["spacy>=3.8.11,<3.9"]
translate = ["transformers>=5.19,<6", "huggingface-hub>=1.31.0,<3.0", "sentencepiece>=0.2.1", "hf-xet>=1.7,<2"]
lang = ["lingua-language-detector>=2.2,<3"]
benchmark = ["trafilatura>=2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2"]
all = [
    "huggingface-hub>=1.31.0,<3.0",
    "hf-xet>=1.7,<2",
    "jieba>=0.42.1,<0.43",
    "Pillow>=12.3,<13",
    "pytesseract>=0.3.13,<0.4",
    "pypdfium2>=5.14,<6",
    "pypdf>=6.20.1,<7",
    "spacy>=3.8.11,<3.9", "transformers>=5.19,<6", "sentencepiece>=0.2.1",
    "lingua-language-detector>=2.2,<3",
    "trafilatura>=2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2",
]

[project.urls]
Repository = "https://github.com/octo-gone/gdelt-regkg"
Documentation = "https://octo-gone.github.io/gdelt-regkg/"
Issues = "https://github.com/octo-gone/gdelt-regkg/issues"
Changelog = "https://github.com/octo-gone/gdelt-regkg/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdelt_regkg"]
exclude = [
    "/src/gdelt_regkg/resources/lexicons/tone.*.json",
    "/src/gdelt_regkg/resources/lexicons/themes.*.json",
    "/src/gdelt_regkg/resources/lexicons/gcam.*",
    "/src/gdelt_regkg/resources/lexicons/locations.*",
    "/src/gdelt_regkg/resources/gcam",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/src/gdelt_regkg/resources/lexicons/tone.*.json",
    "/src/gdelt_regkg/resources/lexicons/themes.*.json",
    "/src/gdelt_regkg/resources/lexicons/gcam.*",
    "/src/gdelt_regkg/resources/lexicons/locations.*",
    "/src/gdelt_regkg/resources/gcam",
]
include = [
    "/.github/scripts/check_docs.py",
    "/.github/workflows/docs.yml",
    "/zensical.toml",
    "/src/gdelt_regkg",
    "/docs",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/.pre-commit-config.yaml",
]

[project.scripts]
gdelt-regkg-cli = "gdelt_regkg.cli:main"

# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
omit = ["tests/*"]
command_line = "-m unittest discover -s tests/"
[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
python_version = "3.12"
files = ["src/gdelt_regkg", ".github/scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Optional NLP dependencies do not all provide type information. Keep their
# implementations out of our check while retaining available public types.
[[tool.mypy.overrides]]
module = ["spacy.*", "transformers.*", "trafilatura.*", "torch.*"]
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dateparser.*", "scipy.*", "sklearn.*", "cupy.*"]
ignore_missing_imports = true

# https://pylint.readthedocs.io/en/stable/user_guide/configuration/all-options.html
[tool.pylint.main]
source-roots = ["src"]
extension-pkg-allow-list = ["lingua"]
ignored-modules = ["torch", "trafilatura", "dateparser"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    # Extraction routines and immutable result containers naturally exceed
    # these design thresholds; they do not indicate incorrect behavior.
    "too-few-public-methods",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-instance-attributes",
    "too-many-boolean-expressions",
    # Heavy optional backends are loaded lazily. Exact type checks deliberately
    # reject bool where numeric GKG components require an int.
    "import-outside-toplevel",
    "unidiomatic-typecheck",
    # Internal modules share compiled matching structures and resource loaders.
    "protected-access",
    "duplicate-code",
    "unnecessary-lambda-assignment",
    "redefined-outer-name",
    "no-else-raise",
    # Rule-file factories import the corresponding result classes lazily.
    "cyclic-import",
    # Ruff/isort own formatting and import ordering.
    "wrong-import-order",
    "ungrouped-imports",
]
ignore-paths = "^tests/.*$"
[tool.pylint.design]
max-args = 10
max-locals = 30
max-branches = 15
max-statements = 80
max-nested-blocks = 5

[tool.pylint.format]
max-line-length = 120

# https://docs.astral.sh/ruff/settings
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["I"]

# https://github.com/PyCQA/isort/blob/main/docs/configuration/options.md
[tool.isort]
profile = "black"
line_length = 100
