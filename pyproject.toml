[project]
name = "gdelt-regkg"
version = "1.0.0"
description = "GDELT GKG reconstruction from article text and metadata"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Nikita Klimin" }]
keywords = ["gdelt", "gkg", "nlp", "news", "text-extraction"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "lingua-language-detector>=2.2,<3",
    "transformers>=5.19,<6",
    "sentencepiece>=0.2.1",
    "hf-xet>=1.6.0",
    "spacy>=3.8.11,<3.9",
]

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pre-commit>=4.3",
    "ruff>=0.14.1",
    "hatchling>=1.27",
    "pylint>=4.0.2",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "twine>=6.1",
]

[project.optional-dependencies]
cpu = ["torch>=2.13", "setuptools>=83"]
cu128 = ["torch>=2.11"]
cu130 = ["torch>=2.13", "setuptools>=83"]
benchmark = ["trafilatura>=2,<3"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdelt_regkg"]
exclude = [
    "/src/gdelt_regkg/resources/lexicons/tone.*.json",
    "/src/gdelt_regkg/resources/lexicons/themes.*.json",
    "/src/gdelt_regkg/resources/lexicons/gcam.*",
    "/src/gdelt_regkg/resources/lexicons/locations.*",
    "/src/gdelt_regkg/resources/gcam",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/docs/reports",
    "/src/gdelt_regkg/resources/lexicons/tone.*.json",
    "/src/gdelt_regkg/resources/lexicons/themes.*.json",
    "/src/gdelt_regkg/resources/lexicons/gcam.*",
    "/src/gdelt_regkg/resources/lexicons/locations.*",
    "/src/gdelt_regkg/resources/gcam",
]
include = [
    "/src/gdelt_regkg",
    "/scripts",
    "/docs",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/.pre-commit-config.yaml",
]

[project.scripts]
gdelt-regkg-build-resources = "gdelt_regkg.scripts.build_resources:main"
gdelt-regkg-build-gazetteer = "gdelt_regkg.scripts.build_gazetteer:main"
gdelt-regkg-build-gcam = "gdelt_regkg.scripts.build_gcam_lexicon:main"
gdelt-regkg-expand-gcam = "gdelt_regkg.scripts.build_gcam_expansion:main"
gdelt-regkg-benchmark-fields = "gdelt_regkg.scripts.benchmark_fields:main"
gdelt-regkg-benchmark-tone = "gdelt_regkg.scripts.benchmark_tone:main"
gdelt-regkg-benchmark-extraction = "gdelt_regkg.scripts.benchmark_extraction:main"
gdelt-regkg-benchmark-samples = "gdelt_regkg.scripts.benchmark_samples:main"
gdelt-regkg-benchmark-ner = "gdelt_regkg.scripts.benchmark_extraction:main_ner"
gdelt-regkg-benchmark-counts = "gdelt_regkg.scripts.benchmark_extraction:main_counts"
gdelt-regkg-benchmark-themes = "gdelt_regkg.scripts.benchmark_extraction:main_themes"
gdelt-regkg-refine-tone = "gdelt_regkg.scripts.refine_tone_lexicon:main"

# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
omit = ["tests/*"]
command_line = "-m unittest discover -s tests/"
[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
python_version = "3.12"
files = ["src/gdelt_regkg", "scripts", ".github/scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Optional NLP dependencies do not all provide type information. Keep their
# implementations out of our check while retaining available public types.
[[tool.mypy.overrides]]
module = ["spacy.*", "transformers.*", "trafilatura.*", "torch.*"]
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dateparser.*"]
ignore_missing_imports = true

# https://pylint.readthedocs.io/en/stable/user_guide/configuration/all-options.html
[tool.pylint.main]
source-roots = ["src"]
extension-pkg-allow-list = ["lingua"]
ignored-modules = ["torch", "trafilatura", "dateparser"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    # Extraction routines and immutable result containers naturally exceed
    # these design thresholds; they do not indicate incorrect behavior.
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-nested-blocks",
    "too-many-instance-attributes",
    "too-many-boolean-expressions",
    # Heavy optional backends are loaded lazily. Exact type checks deliberately
    # reject bool where numeric GKG components require an int.
    "import-outside-toplevel",
    "unidiomatic-typecheck",
    # Internal modules share compiled matching structures and resource loaders.
    "protected-access",
    "duplicate-code",
    "unnecessary-lambda-assignment",
    "redefined-outer-name",
    "no-else-raise",
    # Rule-file factories import the corresponding result classes lazily.
    "cyclic-import",
    # Ruff/isort own formatting and import ordering.
    "wrong-import-order",
    "ungrouped-imports",
]
ignore-paths = "^tests/.*$"
[tool.pylint.format]
max-line-length = 120

# https://docs.astral.sh/ruff/settings
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["I"]

# https://github.com/PyCQA/isort/blob/main/docs/configuration/options.md
[tool.isort]
profile = "black"
line_length = 100
