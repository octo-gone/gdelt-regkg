name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
        required: false
      released-distributions:
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
      - name: Check package metadata and release version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python .github/scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Check documentation
        run: python .github/scripts/check_docs.py
      - name: Install dependencies
        run: uv sync --group dev --extra build --extra ner --extra lang --extra benchmark
      - name: Install the recorded small English model
        run: uv pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Prepare local test resources
        run: |
          uv run --no-sync gdelt-regkg-cli build tone themes counts gcam --use v1 --sources-dir downloads/resources --download-sources --output local-resources
          uv run --no-sync gdelt-regkg-cli build tone themes counts gcam --use v2 --sources-dir downloads/resources --download-sources --output local-resources
          uv run --no-sync gdelt-regkg-cli build all --sources-dir downloads/resources --download-sources --output local-resources
      - name: Build wheel and source distribution
        if: ${{ !inputs.released-distributions }}
        run: uv build --out-dir dist
      - name: Download the published release distributions
        if: ${{ inputs.released-distributions }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release download "$RELEASE_TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - name: Validate distributions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python .github/scripts/check_release.py --tag "$RELEASE_TAG" --dist dist
          uv run --no-sync python -m twine check --strict dist/*
      - name: Install the built wheel
        run: uv pip install --no-deps --reinstall dist/*.whl
      - name: Build and validate multilingual GCAM from the installed wheel
        run: |
          # Use an authored CSV fixture; this build does not require external OCR tools.
          uv run --no-sync python -c 'from pathlib import Path; Path("downloads/resources/imagery-fixture.csv").write_text("word,ImageryValence,approximation,review_status\neau,67.5,class-midpoint,authored-fixture\nsoleil,67.5,class-midpoint,authored-fixture\n")'
          uv run --no-sync gdelt-regkg-cli build gcam --use v5 --source french-imagery=downloads/resources/imagery-fixture.csv --sources-dir downloads/resources --download-sources --output local-resources/v5
          uv run --no-sync python -c 'import json; from pathlib import Path; from gdelt_regkg.fields.gcam import GCAMLexicon, analyze_gcam; root=Path("local-resources/v5"); coverage=json.loads((root/"gcam/coverage.v5.json").read_text()); assert coverage["supported_dimensions"] == 2328; assert coverage["compiled_dimensions"] == 2597; assert len(coverage["approximate_dimensions"]) == 269; lexicon=GCAMLexicon.from_json(root/"lexicons/gcam.v5.json.gz"); result=analyze_gcam("Love and happiness", lexicon=lexicon, original_text="amour bonheur", original_language="fra"); assert result.native_word_count == 2; assert "v24.3" in result.values'
      - name: Test the installed wheel
        run: uv run --no-sync python -m unittest discover -s tests
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
