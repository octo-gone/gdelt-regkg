name: PyPI publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}
      released-distributions: true

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gdelt-regkg/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish checked distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
